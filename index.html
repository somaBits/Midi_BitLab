<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MIDI BitLab</title>
    <meta name="description" content="A visual MIDI controller and waveform editor for creating and manipulating MIDI CC patterns" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />
    
    <!-- iOS-specific meta tags for Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="MIDI BitLab" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    
    <!-- Theme colors for PWA -->
    <meta name="theme-color" content="#000000" />
    <meta name="msapplication-TileColor" content="#000000" />
    
    <!-- p5.js 2.0.5+ (global mode) - local copy for offline support -->
    <script src="./lib/p5.min.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        color: #fff;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #bbb;
        font-size: 14px;
        letter-spacing: .02em;
      }
      a { color: #8bb8ff; text-decoration: none; }
      a:hover { text-decoration: underline; }
      
      /* Prevent context menu on canvas */
      main, canvas {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
    </style>
    
    <script>
      // Prevent context menu globally
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
      });
      
      // Debug right-click detection
      document.addEventListener('mousedown', function(e) {
        console.log('Mouse button pressed:', e.button, 'Right click:', e.button === 2);
      });
    </script>
  </head>
  <body>
    <!-- App entry (ES modules). Our modules will refer to p5 via window.p5 / window.createCanvas etc. -->
    <script type="module" src="./src/main.js"></script>
    
    <!-- Service Worker Registration for Offline Support -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((registration) => {
              console.log('[PWA] Service Worker registered successfully:', registration.scope);
              
              // Handle updates
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                console.log('[PWA] New Service Worker found, installing...');
                
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[PWA] New version available! Refresh to update.');
                  }
                });
              });
            })
            .catch((error) => {
              console.error('[PWA] Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
